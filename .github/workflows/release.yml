# Huanvae Chat 自动发布工作流
#
# 触发条件：推送 v* 标签（如 v1.0.0）
# 功能：
# - 构建 Windows (NSIS EXE，自定义升级流程)
# - 构建 Linux (AppImage + .deb)
# - 构建 macOS (DMG 供手动下载 + .app.tar.gz 供内置更新, ARM64)
# - 构建 Android (APK)
# - 自动生成 latest.json 和 android-latest.json（下载 URL 一律直连原始仓库）
# - 上传到 GitHub Releases

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 顶层权限配置（确保所有 job 都有足够权限）
permissions:
  contents: write

env:
  # 让 JavaScript actions（actions/checkout / actions/setup-node 等）自身
  # 用 Node 24 runtime 跑，对齐 GitHub Actions 2026-06-02 强制 Node 24 的时间线。
  # 注意：这与 setup-node 的 node-version 是两个独立维度，前者控制 action 内部
  # 引擎，后者控制项目代码执行环境。两者已同步升到 24。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================
  # 构建任务
  # ============================================
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
            name: windows-x86_64
          
          # Linux x64
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: ''
            name: linux-x86_64
          
          # macOS Apple Silicon (macos-14/15 是 ARM64 机器)
          # 注意: macos-13 (Intel) 已被 GitHub 废弃
          - platform: macos-14
            target: aarch64-apple-darwin
            args: ''
            name: darwin-aarch64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Windows 依赖：WiX MSI 构建需要 VBSCRIPT 功能
      # 参考: https://tauri.app/start/prerequisites/#vbscript-for-msi-installers
      - name: Enable VBSCRIPT for MSI builds
        if: matrix.platform == 'windows-latest'
        run: |
          # 添加 VBSCRIPT 能力（WiX light.exe 需要）
          DISM /Online /Add-Capability /CapabilityName:VBSCRIPT~~~~
        shell: cmd
        continue-on-error: true

      # Linux 依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # 安装前端依赖
      - name: Install dependencies
        run: pnpm install

      # 写出数据面 mTLS 客户端私钥（gitignored 不在仓，从 secret 解码；仅 build 期用）
      - name: Write mTLS client key
        shell: bash
        env:
          APP_CLIENT_KEY_PEM_BASE64: ${{ secrets.APP_CLIENT_KEY_PEM_BASE64 }}
        run: echo "$APP_CLIENT_KEY_PEM_BASE64" | openssl base64 -d -A > src-tauri/resources/app-client.key.pem

      # 构建 Tauri 应用
      - name: Build Tauri App
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Huanvae Chat ${{ github.ref_name }}'
          releaseBody: |
            ## 更新内容
            
            查看完整更新日志：https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
            
            ## 下载说明
            
            | 平台 | 推荐格式 |
            |------|---------|
            | Windows | `.exe` (推荐，支持自动升级) |
            | Linux | `.AppImage` (免安装) 或 `.deb` (安装到 /opt) |
            | macOS M1/M2 | `_aarch64.dmg` |
            | Android | `_android.apk` |
            
            > 📦 Linux deb 包安装到 `/opt/huanvae-chat/`，支持普通用户运行
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Windows: 构建失败时上传 WiX 日志用于调试
      - name: Upload WiX logs on failure
        if: failure() && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: wix-logs
          path: |
            src-tauri/target/release/wix/
            ${{ runner.temp }}/**/*.log
          if-no-files-found: ignore

      # ============================================
      # Linux: 重新打包 deb 到 /opt（解决用户权限问题）
      # ============================================
      - name: Repack deb for /opt installation
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          set -e
          
          # 找到生成的 deb 文件
          DEB_FILE=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "⚠️ No deb file found, skipping repack"
            exit 0
          fi
          echo "📦 Original deb: $DEB_FILE"
          
          # 提取版本号
          VERSION=$(echo "$DEB_FILE" | grep -oP '\d+\.\d+\.\d+' | head -1)
          echo "📌 Version: $VERSION"
          
          # 创建工作目录
          WORK_DIR=$(mktemp -d)
          echo "📁 Work dir: $WORK_DIR"
          
          # 解压 deb
          dpkg-deb -R "$DEB_FILE" "$WORK_DIR"
          
          # 创建 /opt 目录结构
          mkdir -p "$WORK_DIR/opt/huanvae-chat"
          
          # 移动可执行文件到 /opt
          if [ -f "$WORK_DIR/usr/bin/huanvae-chat-app" ]; then
            mv "$WORK_DIR/usr/bin/huanvae-chat-app" "$WORK_DIR/opt/huanvae-chat/"
            echo "✅ Moved executable to /opt/huanvae-chat/"
          fi
          
          # 移动资源文件到 /opt
          if [ -d "$WORK_DIR/usr/share/huanvae-chat-app" ]; then
            cp -r "$WORK_DIR/usr/share/huanvae-chat-app"/* "$WORK_DIR/opt/huanvae-chat/" 2>/dev/null || true
            rm -rf "$WORK_DIR/usr/share/huanvae-chat-app"
            echo "✅ Moved resources to /opt/huanvae-chat/"
          fi
          
          # 复制图标到 /opt
          ICON_SRC=$(find "$WORK_DIR/usr/share/icons" -name "*.png" -type f 2>/dev/null | head -1)
          if [ -n "$ICON_SRC" ]; then
            cp "$ICON_SRC" "$WORK_DIR/opt/huanvae-chat/icon.png"
            echo "✅ Copied icon to /opt/huanvae-chat/"
          fi
          
          # 清理空的 bin 目录
          rm -rf "$WORK_DIR/usr/bin"
          
          # 更新 .desktop 文件
          DESKTOP_FILE=$(find "$WORK_DIR/usr/share/applications" -name "*.desktop" -type f 2>/dev/null | head -1)
          if [ -n "$DESKTOP_FILE" ]; then
            sed -i 's|Exec=huanvae-chat-app|Exec=/opt/huanvae-chat/huanvae-chat-app|g' "$DESKTOP_FILE"
            sed -i 's|Exec=/usr/bin/huanvae-chat-app|Exec=/opt/huanvae-chat/huanvae-chat-app|g' "$DESKTOP_FILE"
            echo "✅ Updated .desktop file"
          fi
          
          # 创建 postinst 脚本（安装后执行）
          cat > "$WORK_DIR/DEBIAN/postinst" << 'POSTINST'
          #!/bin/bash
          set -e
          
          REPO_URL="https://huanwei520.github.io/Huanvae-Chat-App"
          
          # 创建符号链接到 /usr/local/bin
          ln -sf /opt/huanvae-chat/huanvae-chat-app /usr/local/bin/huanvae-chat
          
          # 设置目录权限
          chmod -R 755 /opt/huanvae-chat
          
          # 更新桌面数据库
          if command -v update-desktop-database &> /dev/null; then
            update-desktop-database /usr/share/applications 2>/dev/null || true
          fi
          
          # 更新图标缓存
          if command -v gtk-update-icon-cache &> /dev/null; then
            gtk-update-icon-cache /usr/share/icons/hicolor 2>/dev/null || true
          fi
          
          # 配置 APT 仓库源（用于自动更新）
          if [ ! -f /etc/apt/sources.list.d/huanvae-chat.list ]; then
            echo "📦 配置 APT 仓库源..."
            
            # 下载并安装 GPG 密钥
            if command -v curl &> /dev/null; then
              curl -fsSL "${REPO_URL}/gpg.key" 2>/dev/null | \
                gpg --dearmor -o /usr/share/keyrings/huanvae-chat.gpg 2>/dev/null || true
            elif command -v wget &> /dev/null; then
              wget -qO- "${REPO_URL}/gpg.key" 2>/dev/null | \
                gpg --dearmor -o /usr/share/keyrings/huanvae-chat.gpg 2>/dev/null || true
            fi
            
            # 添加仓库源（仅支持 amd64 架构）
            if [ -f /usr/share/keyrings/huanvae-chat.gpg ]; then
              echo "deb [arch=amd64 signed-by=/usr/share/keyrings/huanvae-chat.gpg] ${REPO_URL} stable main" > \
                /etc/apt/sources.list.d/huanvae-chat.list
              echo "✅ APT 仓库已配置，可使用 apt upgrade 更新"
            fi
          fi
          
          echo ""
          echo "✅ Huanvae Chat 已安装到 /opt/huanvae-chat/"
          echo "   运行命令: huanvae-chat"
          echo "   更新命令: sudo apt update && sudo apt upgrade"
          echo ""
          POSTINST
          chmod 755 "$WORK_DIR/DEBIAN/postinst"
          
          # 创建 prerm 脚本（卸载前执行）
          cat > "$WORK_DIR/DEBIAN/prerm" << 'PRERM'
          #!/bin/bash
          set -e
          rm -f /usr/local/bin/huanvae-chat
          PRERM
          chmod 755 "$WORK_DIR/DEBIAN/prerm"
          
          # 创建 postrm 脚本（卸载后执行）
          cat > "$WORK_DIR/DEBIAN/postrm" << 'POSTRM'
          #!/bin/bash
          if [ "$1" = "purge" ] || [ "$1" = "remove" ]; then
            # 清理应用目录
            rm -rf /opt/huanvae-chat 2>/dev/null || true
            
            # 清理 APT 仓库配置
            rm -f /etc/apt/sources.list.d/huanvae-chat.list 2>/dev/null || true
            rm -f /usr/share/keyrings/huanvae-chat.gpg 2>/dev/null || true
          fi
          POSTRM
          chmod 755 "$WORK_DIR/DEBIAN/postrm"
          
          # 更新 control 文件
          INSTALLED_SIZE=$(du -sk "$WORK_DIR" | cut -f1)
          sed -i "s/^Installed-Size:.*/Installed-Size: $INSTALLED_SIZE/" "$WORK_DIR/DEBIAN/control"
          
          # 重新打包（覆盖原文件）
          dpkg-deb -b "$WORK_DIR" "$DEB_FILE"
          
          echo ""
          echo "✅ Repacked deb: $DEB_FILE"
          echo ""
          
          # 验证包内容
          echo "=== Package contents (first 15 lines) ==="
          dpkg-deb -c "$DEB_FILE" | head -15
          
          # 清理
          rm -rf "$WORK_DIR"

      # Linux: 重新上传修改后的 deb 到 Release
      - name: Re-upload repacked deb
        if: matrix.platform == 'ubuntu-24.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 提取版本号
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          
          DEB_FILE="src-tauri/target/release/bundle/deb/Huanvae-Chat-App_${VERSION}_amd64.deb"
          
          if [ ! -f "$DEB_FILE" ]; then
            echo "⚠️ Deb file not found: $DEB_FILE"
            exit 0
          fi
          
          echo "📤 Re-uploading repacked deb..."
          
          # 使用 --clobber 覆盖原来上传的 deb
          gh release upload ${{ github.ref_name }} "$DEB_FILE" --clobber
          
          echo "✅ Successfully re-uploaded: $(basename $DEB_FILE)"

  # ============================================
  # Android 构建任务
  # ============================================
  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install dependencies
        run: pnpm install

      # 配置 Android 签名
      - name: Setup Android Signing
        run: |
          cd src-tauri/gen/android/app
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      # 写出数据面 mTLS 客户端私钥（gitignored 不在仓，从 secret 解码；仅 build 期用）
      - name: Write mTLS client key
        shell: bash
        env:
          APP_CLIENT_KEY_PEM_BASE64: ${{ secrets.APP_CLIENT_KEY_PEM_BASE64 }}
        run: echo "$APP_CLIENT_KEY_PEM_BASE64" | openssl base64 -d -A > src-tauri/resources/app-client.key.pem

      # 构建 Android APK
      - name: Build Android APK
        run: pnpm tauri android build --apk
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          CI: false

      # 上传 APK 到 Release
      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          
          # 查找生成的 APK 文件（release 版本）
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name "*.apk" -type f 2>/dev/null | head -1)
          
          # 如果没找到 universal，尝试 arm64
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" -type f 2>/dev/null | head -1)
          fi
          
          if [ -f "$APK_PATH" ]; then
            # 重命名为标准格式
            APK_NAME="Huanvae-Chat-App_${VERSION}_android.apk"
            cp "$APK_PATH" "$APK_NAME"
            
            # 创建或更新 Release
            gh release upload ${{ github.ref_name }} "$APK_NAME" --clobber || \
              gh release create ${{ github.ref_name }} "$APK_NAME" --title "Huanvae Chat ${{ github.ref_name }}" --notes "Android APK"
            
            echo "✅ Uploaded: $APK_NAME"
          else
            echo "❌ APK not found"
            find src-tauri/gen/android -name "*.apk" -type f 2>/dev/null
            exit 1
          fi

  # ============================================
  # 生成更新清单
  # ============================================
  generate-manifest:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Wait for all signature files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          
          # 期望的签名文件列表（使用 NSIS EXE）
          # 注意 macOS：更新包是 .app.tar.gz（不是 DMG——Tauri v2 updater 不消费 DMG，
          # 且 tauri 从不给 DMG 签名），且 tauri-action 给它的命名不含版本号，
          # 形如 <productName>_<arch>.app.tar.gz，所以这里不能拼 ${VERSION}。
          EXPECTED_SIGS=(
            "Huanvae-Chat-App_${VERSION}_x64-setup.exe.sig"
            "Huanvae-Chat-App_${VERSION}_amd64.AppImage.sig"
            "Huanvae-Chat-App_aarch64.app.tar.gz.sig"
          )
          
          echo "等待签名文件上传..."
          echo "期望文件: ${EXPECTED_SIGS[*]}"
          
          MAX_WAIT=300  # 最多等待 5 分钟
          WAITED=0
          
          while [ $WAITED -lt $MAX_WAIT ]; do
            RELEASE_INFO=$(gh api repos/${REPO}/releases/tags/${TAG} 2>/dev/null || echo "{}")
            ASSETS=$(echo "$RELEASE_INFO" | jq -r '.assets[].name' 2>/dev/null || echo "")
            
            ALL_FOUND=true
            for SIG in "${EXPECTED_SIGS[@]}"; do
              if ! echo "$ASSETS" | grep -q "^${SIG}$"; then
                echo "  缺少: $SIG"
                ALL_FOUND=false
              fi
            done
            
            if [ "$ALL_FOUND" = true ]; then
              echo "✅ 所有签名文件已上传！"
              echo "当前资产列表:"
              echo "$ASSETS" | grep "\.sig$" || true
              break
            fi
            
            echo "等待中... (${WAITED}s/${MAX_WAIT}s)"
            sleep 10
            WAITED=$((WAITED + 10))
          done
          
          if [ $WAITED -ge $MAX_WAIT ]; then
            echo "⚠️ 等待超时，继续执行（部分签名可能缺失）"
          fi

      - name: Download release info
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取 release 信息
          RELEASE_INFO=$(gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }})
          echo "Release ID: $(echo $RELEASE_INFO | jq -r '.id')"
          
          # 获取所有资产
          ASSETS=$(echo $RELEASE_INFO | jq -r '.assets')
          echo "Assets: $ASSETS"
          
          # 保存到文件
          echo "$ASSETS" > assets.json

      # ============================================
      # 下载 Release 产物 + 必需清单断言（整个 job 的闸门）
      # ============================================
      #
      # 🔴 位置很关键：这一步从「两个清单都已发布之后」提到了「任何清单生成之前」。
      #    旧形态是 `gh release download ... || true`（下载失败被整个吞掉）+ 后面
      #    无条件 `aws s3 cp latest-r2.json`，于是**只拉到一部分产物时清单照样发布**、
      #    指向 v<TAG>/ 下并不存在的文件 ⇒ 全体客户端应用内更新 404，
      #    而 workflow 全绿、无人告警、且不会自己恢复。
      #    闸门前置之后，缺任何一个必需产物时，下面所有「生成 / 上传清单」的步骤
      #    都不会执行（GitHub Actions 在某步失败后跳过同 job 的后续步骤）。
      #
      #    顺带解掉 sha256 的排序障碍：APK 在这里就已落盘，
      #    后面的 android-latest.json 才能对**真实产物字节**算摘要。
      - name: Download release assets and assert required payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p r2-upload

          # 🔴 这里**没有** `|| true`：下载失败（含「通配符零命中」—— gh 自身即非零退出）
          #    必须让 step 直接红。别再给它加任何兜底。
          gh release download "${TAG}" -D r2-upload \
            -p "*.exe" -p "*.exe.sig" \
            -p "*.AppImage" -p "*.AppImage.sig" \
            -p "*.dmg" \
            -p "*.app.tar.gz" -p "*.app.tar.gz.sig" \
            -p "*_android.apk" \
            -p "*.deb"

          echo "=== Files downloaded ==="
          ls -lh r2-upload/

          # ── 必需清单：逐个文件名显式列出（禁止用通配符 / 数个数代替）──
          #
          # Tier-1｜更新链路命门：latest.json / android-latest.json 的 URL 直接指向它们，
          #   缺任一 ⇒ 客户端更新 404。
          #   ⚠️ .app.tar.gz **不带版本号**（tauri-action 的命名如此），别拼 ${VERSION}。
          # Tier-2｜上面 glob 声明要拉、但没有清单 URL 指向：
          #   .sig 本身客户端**不会**去 R2 取（签名以字符串内嵌进 latest.json），
          #   但它缺失即说明上游构建/签名出了问题，且 latest.json 会拿到空签名字符串
          #   （空串喂 minisign 必报 Invalid encoding）⇒ 一样要红；
          #   .dmg / .deb 是手动下载渠道的产物，同样「声明要拉就该拉到」。
          # ⚠️ *.deb.sig 在 Release 里**存在**，却不在上面的 glob 里（既有的不对称，本次未改），
          #   所以它**不在**必需清单内 —— 清单必须与 glob 一致，否则会断言一个根本没下载的文件。
          REQUIRED_FILES=(
            "Huanvae-Chat-App_${VERSION}_x64-setup.exe"
            "Huanvae-Chat-App_aarch64.app.tar.gz"
            "Huanvae-Chat-App_${VERSION}_amd64.AppImage"
            "Huanvae-Chat-App_${VERSION}_android.apk"
            "Huanvae-Chat-App_${VERSION}_x64-setup.exe.sig"
            "Huanvae-Chat-App_${VERSION}_amd64.AppImage.sig"
            "Huanvae-Chat-App_aarch64.app.tar.gz.sig"
            "Huanvae-Chat-App_${VERSION}_aarch64.dmg"
            "Huanvae-Chat-App_${VERSION}_amd64.deb"
          )
          # 交给后面的 R2 上传步骤复用（放工作区根，不在 r2-upload/ 里 ⇒ 不会被传上 R2）
          printf '%s\n' "${REQUIRED_FILES[@]}" > required-r2-files.txt

          MISSING=()
          for name in "${REQUIRED_FILES[@]}"; do
            [ -s "r2-upload/${name}" ] || MISSING+=("${name}")
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ 必需产物缺失 ${#MISSING[@]}/${#REQUIRED_FILES[@]}，拒绝继续（本次不会发布任何更新清单）："
            for name in "${MISSING[@]}"; do
              echo "  - ${name}"
            done
            exit 1
          fi
          echo "✅ 必需产物齐全（${#REQUIRED_FILES[@]}/${#REQUIRED_FILES[@]}）"

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"

          # 自建 R2 更新源
          R2_BASE="https://store.huanvae.cn/update/huanvae-chat/${TAG}"

          # 获取 release 资产信息
          echo "Fetching release assets..."
          RELEASE_INFO=$(gh api repos/${REPO}/releases/tags/${TAG})
          
          # 从 release 中获取签名文件内容
          get_signature_from_release() {
            local pattern=$1
            local sig_url=$(echo "$RELEASE_INFO" | jq -r ".assets[] | select(.name | endswith(\"${pattern}.sig\")) | .browser_download_url" | head -1)
            if [ -n "$sig_url" ] && [ "$sig_url" != "null" ]; then
              curl -sL "$sig_url" 2>/dev/null || echo ""
            else
              echo ""
            fi
          }
          
          # 获取各平台签名（使用 NSIS EXE）
          WIN_NSIS_SIG=$(get_signature_from_release "_x64-setup.exe")
          # macOS 取 .app.tar.gz 的签名：_aarch64.dmg.sig 这个资产从来不存在
          # （tauri 只签 updater 产物与自包含安装包，DMG 两者都不是）
          MAC_SIG=$(get_signature_from_release "_aarch64.app.tar.gz")
          LINUX_SIG=$(get_signature_from_release "_amd64.AppImage")
          
          echo "Windows NSIS signature: ${WIN_NSIS_SIG:0:50}..."
          echo "macOS signature: ${MAC_SIG:0:50}..."
          echo "Linux signature: ${LINUX_SIG:0:50}..."
          
          # 验证签名版本是否匹配当前版本
          verify_signature_version() {
            local sig=$1
            local name=$2
            if [ -n "$sig" ]; then
              # 解码签名并检查文件名中的版本号
              local decoded=$(echo "$sig" | base64 -d 2>/dev/null || echo "")
              if echo "$decoded" | grep -q "_${VERSION}_"; then
                echo "✅ $name 签名版本正确 (v${VERSION})"
              else
                echo "❌ $name 签名版本不匹配！"
                echo "   期望版本: ${VERSION}"
                echo "   签名内容: $(echo "$decoded" | head -3)"
                # 不退出，只警告
              fi
            fi
          }

          # macOS 更新包名不含版本号，套不上 verify_signature_version 的 _${VERSION}_ 判据；
          # 改为校验「签名确实指向 .app.tar.gz 更新包」。空签名是 macOS 更新彻底不可用的病征
          # （空串喂 minisign 必报 Invalid encoding in minisign data），必须显式喊出来。
          verify_macos_signature() {
            local sig=$1
            if [ -z "$sig" ]; then
              echo "❌ macOS 签名为空 —— macOS 内置更新将完全不可用，请检查 .app.tar.gz 是否已产出并上传"
              return
            fi
            local decoded=$(echo "$sig" | base64 -d 2>/dev/null || echo "")
            if echo "$decoded" | grep -q "\.app\.tar\.gz"; then
              echo "✅ macOS 签名指向 .app.tar.gz 更新包"
            else
              echo "❌ macOS 签名内容不是 .app.tar.gz（Tauri v2 updater 不消费 DMG）"
              echo "   签名内容: $(echo "$decoded" | head -3)"
            fi
          }

          echo ""
          echo "=== 签名版本验证 ==="
          verify_signature_version "$WIN_NSIS_SIG" "Windows NSIS"
          verify_signature_version "$LINUX_SIG" "Linux AppImage"
          verify_macos_signature "$MAC_SIG"
          
          # 构建 JSON（文件名必须与 tauri 实际生成的一致）
          # productName: Huanvae-Chat-App
          # 支持的平台键（使用 NSIS EXE）：
          # - windows-x86_64: 默认 Windows (NSIS EXE)
          # - windows-x86_64-msi: 兼容旧版本（v1.0.28及之前请求此key，指向同一个EXE）
          # - darwin-aarch64: macOS ARM64（更新包 .app.tar.gz，非 DMG）
          # - linux-x86_64: 默认 Linux (AppImage)
          # - linux-x86_64-appimage: 明确指定 AppImage

          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          NOTES="Huanvae Chat ${TAG} 更新\n\n查看完整更新日志: https://github.com/${REPO}/releases/tag/${TAG}"

          # GitHub Release 版（直连原始仓库链接，供 tauri.conf.json 的备用 endpoint 使用）
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "${NOTES}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_NSIS_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/Huanvae-Chat-App_${VERSION}_x64-setup.exe"
              },
              "windows-x86_64-msi": {
                "signature": "${WIN_NSIS_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/Huanvae-Chat-App_${VERSION}_x64-setup.exe"
              },
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/Huanvae-Chat-App_aarch64.app.tar.gz"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/Huanvae-Chat-App_${VERSION}_amd64.AppImage"
              },
              "linux-x86_64-appimage": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/Huanvae-Chat-App_${VERSION}_amd64.AppImage"
              }
            }
          }
          EOF

          # R2 版（R2 URL，供 store.huanvae.cn 首选 endpoint 使用）
          cat > latest-r2.json << EOF
          {
            "version": "${VERSION}",
            "notes": "${NOTES}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_NSIS_SIG}",
                "url": "${R2_BASE}/Huanvae-Chat-App_${VERSION}_x64-setup.exe"
              },
              "windows-x86_64-msi": {
                "signature": "${WIN_NSIS_SIG}",
                "url": "${R2_BASE}/Huanvae-Chat-App_${VERSION}_x64-setup.exe"
              },
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "${R2_BASE}/Huanvae-Chat-App_aarch64.app.tar.gz"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "${R2_BASE}/Huanvae-Chat-App_${VERSION}_amd64.AppImage"
              },
              "linux-x86_64-appimage": {
                "signature": "${LINUX_SIG}",
                "url": "${R2_BASE}/Huanvae-Chat-App_${VERSION}_amd64.AppImage"
              }
            }
          }
          EOF

          echo "=== GitHub Release latest.json (direct GitHub URLs): ==="
          cat latest.json
          echo ""
          echo "=== R2 latest-r2.json (R2 URLs): ==="
          cat latest-r2.json

      - name: Upload latest.json to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} latest.json --clobber
          echo "✅ Uploaded latest.json to release"

      # ============================================
      # 生成 Android 更新清单
      # ============================================
      - name: Generate android-latest.json
        run: |
          set -eo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"

          # Android APK 文件名格式（与 build-android job 上传的文件名一致）
          APK_NAME="Huanvae-Chat-App_${VERSION}_android.apk"
          R2_BASE="https://store.huanvae.cn/update/huanvae-chat/${TAG}"

          # ── sha256 的**唯一真值源**：上一步下载下来、随后原样上传到 R2 的那份 APK 字节 ──
          #
          # 这也是把 "Download release assets…" 提到本步之前的第二个原因：本步执行时
          # APK 必须已经在盘上，否则只能写一个占位值，那就又造出一个死字段。
          #
          # BACKLOG: 客户端目前**不**校验 sha256 —— src/update/service.android.ts 只读
          #   version / notes / url（+ 曾经的 size）；src-tauri/src/android_update.rs 下载完
          #   只比对字节数（PendingApkInstall.size），不算摘要。所以此刻这个字段的
          #   **唯一消费方是本 workflow 自己**（下面这两条「清单 vs 产物」断言）。
          #   等客户端落盘校验接上之后，它才成为端到端的完整性校验。
          #   在那之前不许把它描述成「已实现完整性校验」。
          APK_PATH="r2-upload/${APK_NAME}"
          if [ ! -s "$APK_PATH" ]; then
            echo "❌ 找不到 APK 产物: ${APK_PATH}"
            echo "   （必需清单断言本应先拦下，这里是第二道保险 —— 没有 APK 就绝不生成清单）"
            exit 1
          fi
          APK_SHA256="$(sha256sum "$APK_PATH" | cut -d' ' -f1)"
          echo "APK 产物 sha256: ${APK_SHA256}  (${APK_PATH})"

          # GitHub Release 版（直连原始仓库链接，供 GitHub 源回退使用）
          cat > android-latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Huanvae Chat ${TAG} Android 更新\n\n查看完整更新日志: https://github.com/${REPO}/releases/tag/${TAG}",
            "url": "https://github.com/${REPO}/releases/download/${TAG}/${APK_NAME}",
            "directUrl": "https://github.com/${REPO}/releases/download/${TAG}/${APK_NAME}",
            "sha256": "${APK_SHA256}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          # R2 版（R2 URL，供自建源使用）
          cat > android-latest-r2.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Huanvae Chat ${TAG} Android 更新\n\n查看完整更新日志: https://github.com/${REPO}/releases/tag/${TAG}",
            "url": "${R2_BASE}/${APK_NAME}",
            "directUrl": "https://github.com/${REPO}/releases/download/${TAG}/${APK_NAME}",
            "sha256": "${APK_SHA256}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          # ── 断言 ①：清单 vs 产物（不是拿清单跟自己比）──
          # 把刚写进 JSON 的值**解析回来**，与**重新对 APK 文件算一遍**的结果比对。
          # 它拦的是模板/引号/变量未展开这类静默写坏（写坏时 jq 取到的就不是这个摘要）。
          VERIFY_SHA256="$(sha256sum "$APK_PATH" | cut -d' ' -f1)"
          for manifest in android-latest.json android-latest-r2.json; do
            IN_MANIFEST="$(jq -r '.sha256' "$manifest")"
            if [ "$IN_MANIFEST" != "$VERIFY_SHA256" ]; then
              echo "❌ ${manifest} 的 sha256 与 APK 产物不符，拒绝发布："
              echo "   清单: ${IN_MANIFEST}"
              echo "   产物: ${VERIFY_SHA256}  (${APK_PATH})"
              exit 1
            fi
          done
          echo "✅ 两个 android 清单的 sha256 均与 APK 产物一致"

          echo "=== GitHub android-latest.json: ==="
          cat android-latest.json
          echo ""
          echo "=== R2 android-latest-r2.json: ==="
          cat android-latest-r2.json

      - name: Upload android-latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} android-latest.json --clobber
          echo "✅ Uploaded android-latest.json to release"

      # ============================================
      # 上传到 Cloudflare R2（自建更新源）
      # ============================================
      # 产物已由本 job 靠前的 "Download release assets and assert required payload"
      # 下载并断言过齐全；这里只负责上传 + **发布清单之前的第二道闸门**。
      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT }}
          AWS_REGION: auto
        run: |
          set -eo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          BUCKET="${{ secrets.CF_R2_BUCKET }}"

          # Upload release assets
          # 逐个记下**真的传上去**的文件名，供下面的闸门核对。
          : > uploaded-r2-files.txt
          for file in r2-upload/*; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            aws s3 cp "$file" "s3://${BUCKET}/huanvae-chat/${TAG}/${filename}" \
              --endpoint-url "$AWS_ENDPOINT_URL"
            echo "✅ ${filename}"
            echo "${filename}" >> uploaded-r2-files.txt
          done

          # ── 闸门 ①：必需产物逐个核对「确实上传过」──
          #
          # 🔴 旧实现里 r2-upload/ 为空时上面这个 for 循环**一次都不执行却照样往下走**，
          #    latest.json 随后被无条件发布 ⇒ 指向一个空目录 ⇒ 全体客户端 404、流水线全绿。
          #    清单文件由靠前那个断言步骤写出，两处共用同一份真值源。
          MISSING=()
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            grep -qxF "$name" uploaded-r2-files.txt || MISSING+=("$name")
          done < required-r2-files.txt
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ 以下必需产物没有上传到 R2，拒绝发布更新清单："
            for name in "${MISSING[@]}"; do
              echo "  - ${name}"
            done
            exit 1
          fi

          # ── 闸门 ②：即将发布的 android 清单 sha256 vs **刚上传的那份 APK 字节** ──
          # 这是跨 step 的真实比对：清单在别的 step 生成，APK 在这里上传。
          if [ ! -s android-latest-r2.json ]; then
            echo "❌ android-latest-r2.json 不存在或为空 —— 上游生成步骤没跑成功，拒绝发布"
            exit 1
          fi
          APK_NAME="Huanvae-Chat-App_${VERSION}_android.apk"
          MANIFEST_SHA256="$(jq -r '.sha256' android-latest-r2.json)"
          ACTUAL_SHA256="$(sha256sum "r2-upload/${APK_NAME}" | cut -d' ' -f1)"
          if [ "$MANIFEST_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "❌ android-latest-r2.json 的 sha256 与刚上传的 APK 不符，拒绝发布清单："
            echo "   清单: ${MANIFEST_SHA256}"
            echo "   产物: ${ACTUAL_SHA256}  (r2-upload/${APK_NAME})"
            exit 1
          fi
          echo "✅ android 清单 sha256 与已上传 APK 一致: ${ACTUAL_SHA256}"

          # ── 只有上面两道闸门都过了，才发布两个更新清单 ──
          # Upload R2 版 latest.json（下载 URL 指向 R2）
          aws s3 cp latest-r2.json "s3://${BUCKET}/huanvae-chat/latest.json" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --content-type "application/json"

          # Upload R2 版 android-latest.json（下载 URL 指向 R2）
          # 🔴 不再用 `if [ -f … ]` 静默跳过：文件不在就是缺陷，上面闸门 ② 已让它红。
          aws s3 cp android-latest-r2.json "s3://${BUCKET}/huanvae-chat/android-latest.json" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --content-type "application/json"

          # 🔴 有断言前提的宣告：旧版这里是无条件的 "✅ All files uploaded to R2"，
          #    即使一个产物都没传也照样打印。
          REQUIRED_COUNT="$(grep -c . required-r2-files.txt)"
          echo "✅ 必需产物 ${REQUIRED_COUNT}/${REQUIRED_COUNT} 已上传，两个更新清单已发布到 R2"

      - name: Notify soft-store webhook
        if: always()
        run: |
          curl -sf -X POST "https://store.huanvae.cn/webhook/huanvae-chat" \
            -H "Authorization: Bearer ${{ secrets.SOFT_STORE_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"version\": \"${{ github.ref_name }}\", \"repo\": \"${{ github.repository }}\"}" \
            && echo "✅ Webhook notified" \
            || echo "⚠️ Webhook notification failed (non-blocking)"

