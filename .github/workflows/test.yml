name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - 'Huanvae-Chat-App/**'
  pull_request:
    paths:
      - 'Huanvae-Chat-App/**'

defaults:
  run:
    working-directory: Huanvae-Chat-App

# 让 JavaScript actions（actions/checkout / actions/setup-node 等）自身用
# Node 24 runtime 跑，对齐 GitHub Actions 2026-06-02 强制 Node 24 的时间线。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-tests:
    name: Vitest Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: Huanvae-Chat-App/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm test:run
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: Huanvae-Chat-App/coverage/

  e2e-tests:
    name: Playwright E2E & Visual Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: Huanvae-Chat-App/pnpm-lock.yaml
      - run: pnpm install
      - run: npx playwright install chromium --with-deps
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: Huanvae-Chat-App/playwright-report/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: Huanvae-Chat-App/e2e/test-results/
