<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- viewport-fit=cover：edge-to-edge 下让 WebView 暴露 env(safe-area-inset-*)，
         否则状态栏/导航栏安全区一律取 0（移动端各处 mobile CSS 依赖此值避让系统栏）

         maximum-scale=1.0 + user-scalable=no：禁掉 WebView 的【整页】捏合缩放。
         缺它时 Android WebView（Chromium）会把双指捏合当成 visual viewport 缩放，
         把整个 App 放大到最多 5 倍（gen-48 真机实测 visualViewport.scale 1 → 3.38 → 5，
         同一手势打上本补丁后恒为 1）。注意这条【不影响】图片查看器的缩放——
         那一套走的是 src/chat/shared/useImageZoom.ts 的 touch 事件 + CSS transform，
         与浏览器页面缩放是两条独立通道。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Tauri + React + Typescript</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
