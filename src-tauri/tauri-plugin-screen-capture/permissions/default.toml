[default]
description = "screen-capture 插件默认权限：允许全部 3 条命令面（capture_start/capture_stop/capture_status）。"
# 注：autogenerated 的 permission identifier 为 kebab-case（tauri-plugin build 约定），
# commands.allow 才是 snake_case 命令名。
permissions = [
    "allow-capture-start",
    "allow-capture-stop",
    "allow-capture-status",
]
