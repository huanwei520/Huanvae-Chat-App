# ============================================
# Huanvae Chat App - Tauri 后端配置
# ============================================
#
# ## 平台支持
# - 桌面端 (Windows/macOS/Linux): 完整功能
# - 移动端 (Android/iOS): 部分功能（无托盘、无会话锁）
#
# ## 更新日志
# - 2026-01-22: 添加桌面/移动端平台分离，条件编译依赖
# ============================================

[package]
name = "huanvae-chat-app"
version = "1.1.33"
description = "Huanvae Chat App - 即时通讯应用"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "huanvae_chat_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

# ============================================
# 共享依赖（所有平台）
# ============================================
[dependencies]
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-fs = "2.5.1"
tauri-plugin-http = "2.5.9"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-os = "2.3.2"

# 序列化
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# 异步运行时
tokio = { version = "1.49.0", features = ["full"] }

# HTTP 客户端（下载头像、文件下载）
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }

# 异步流处理
futures-util = "0.3.31"

# 目录管理
dirs = "6.0.0"

# 时间
chrono = { version = "0.4.43", features = ["serde"] }

# 错误处理
thiserror = "2.0.18"

# SQLite 数据库（纯 Rust 实现）
rusqlite = { version = "0.34.0", features = ["bundled"] }

# 线程安全的单例
once_cell = "1.21.3"

# 互斥锁
parking_lot = "0.12.5"

# MAC 地址获取（仅非 iOS：iOS 自 iOS 7 起强制返回固定假地址，
# 且 mac_address 1.1.8 crate 不支持 iOS target —— 见下方
# [target.'cfg(not(target_os = "ios"))'.dependencies] 段）

# ============================================
# 局域网文件互传（所有平台共享）
# ============================================

# mDNS 服务发现
mdns-sd = "0.17.2"

# 本地 IP 地址获取
local-ip-address = "0.6.9"

# 文件哈希 (CRC32 - 高性能跨平台校验)
# 官方支持: Android AOSP, Windows, macOS, Linux, iOS
# 性能: ~7.3 GB/s (比 SHA-256 快约 14 倍)
# 文档: https://docs.rs/crc32fast/
crc32fast = "1.4"
hex = "0.4.3"

# UUID 生成
uuid = { version = "1.19.0", features = ["v4"] }

# 异步通道（用于事件通知）
async-channel = "2.5.0"

# 并行传输支持
# - tokio-util: CancellationToken 用于取消单个文件传输, io 用于移动端媒体服务器
# - futures: join_all 用于等待所有并行任务完成
# 注意: CancellationToken 在 sync 模块中，默认包含无需额外 feature
tokio-util = { version = "0.7.18", features = ["io"] }
futures = "0.3"

# MIME 类型猜测
mime_guess = "2.0.5"

# 主机名获取
hostname = "0.4.2"

# HTTP 服务器（移动端媒体服务器）
axum = "0.8.8"

# ============================================
# 数据面 WebSocket（ws_proxy.rs：浏览器 WebSocket 验不过自签 leaf，搬到 Rust）
# 与 secure_net.rs(reqwest+rustls)同套：rustls 只信内置私有 CA。
# 只启 connect + __rustls-tls(rustls Connector/握手所需的最小内部 feature)，
# 不用 rustls-tls-webpki-roots —— 恒传自建 Connector::Rustls(只信内置 CA)，
# webpki-roots 公共根数据永不被用到，纳入即冗余(零污染)。
# ============================================
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "__rustls-tls"] }
# rustls 与 reqwest 共用 0.23(ring provider)；显式构建 ClientConfig + ring provider
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"

# ============================================
# 桌面平台专属依赖 (Windows/macOS/Linux)
# ============================================
# ============================================
# 非 iOS 平台：MAC 地址获取
# iOS 自 iOS 7 起强制返回固定假地址 02:00:00:00:00:00，
# 且 mac_address 1.1.8 crate 不支持 iOS target
# ============================================
[target.'cfg(not(target_os = "ios"))'.dependencies]
mac_address = "1.1.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 托盘图标支持
tauri = { version = "2.11.1", features = ["protocol-asset", "tray-icon"] }
# 更新器
tauri-plugin-updater = "2.10.1"
# 自建分片下载器的签名校验：与 tauri-plugin-updater 内部 verify_signature 用的是同一套
# （updater.rs:1453 minisign-verify + base64）。自己下载就绕过了插件的校验，必须原样补回来，
# 版本与插件对齐以便 Cargo 统一，不引入重复版本。
minisign-verify = "0.2"
base64 = "0.22"
# 系统进程信息（用于会话锁检测）
sysinfo = "0.33.1"
# 剪贴板管理（用于粘贴图片功能）
# 官方插件：https://v2.tauri.app/plugin/clipboard/
tauri-plugin-clipboard-manager = "2.3.2"
# PNG 编码（将剪贴板 RGBA 数据转为 PNG 文件）
png = "0.17"

# ============================================
# 桌面平台专属：密钥链依赖
# keyring 3.x 默认不启用任何后端，必须显式指定 feature
# Android/iOS 不使用 keyring，使用平台原生安全存储
# ============================================

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
# Windows 注册表访问（用于检测安装类型：MSI vs NSIS）
winreg = "0.55.0"
# ShellExecuteW 用于 UAC 提权启动 HuanvaeGuard 服务
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 不再用 keyring（系统钥匙串对未签名 App 每次读都弹 ACL 框，详见 .claude/rules/common.md）。
# 改 App 私有 AES-256-GCM 加密文件存密码 + Touch ID(LocalAuthentication) 门禁。
aes-gcm = "0.10"            # AES-256-GCM 认证加密
getrandom = "0.2"          # 生成随机 nonce
sha2 = "0.10"              # 由设备 host UUID 派生 256-bit 密钥
libc = "0.2"               # gethostuuid 取设备 UUID
# Touch ID：LocalAuthentication 的 LAContext（objc2 生态，与 tauri 已引入版本对齐）
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
block2 = "0.6"

# ============================================
# 移动平台专属依赖 (Android/iOS)
# ============================================
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# 持久化存储（密码 + 会话自动恢复，无需生物验证）
# 后台被杀后重新打开自动恢复登录状态，与 QQ/微信 体验一致
# 官方插件：https://v2.tauri.app/plugin/store/
tauri-plugin-store = "2.4.3"

# ============================================
# 移动端返回按钮监听
# ============================================
# 处理 Android 手势返回和 iOS 返回按钮
# 参考: https://jsr.io/@kingsword/tauri-plugin-mobile-onbackpressed-listener
tauri-plugin-mobile-onbackpressed-listener = "2.0.1"

# ============================================
# NFC 读卡（Android / iOS）
# ============================================
# 前台扫卡 + 读 NDEF URI Record，App 内主动调 scan() 监听
# 桌面端不参与链接（crate 顶层 #![cfg(mobile)] 守卫）
# 参考: https://v2.tauri.app/plugin/nfc/
tauri-plugin-nfc = "2.3.5"

# ============================================
# Android 专属：文件系统访问 + APK 安装
# iOS 上不需要这些（iOS 用 PhotoKit / FileProvider；不支持应用内 APK 安装）
# ============================================
[target.'cfg(target_os = "android")'.dependencies]
# 处理 Android content:// URI 文件读取
# 参考: https://github.com/aiueo13/tauri-plugin-android-fs
tauri-plugin-android-fs = "24.1.0"

# 应用内 APK 自动更新（下载 + 调用系统安装器）
# 参考: https://jsr.io/@kingsword/tauri-plugin-android-package-install
tauri-plugin-android-package-install = "2.0.1"
