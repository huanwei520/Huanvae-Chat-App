[default]
description = "hg-guard 插件默认权限：允许全部 6 条命令面（hg_status/hg_connect/hg_disconnect/hg_prepare_vpn/hg_control_start/hg_control_stop）。"
# 注：autogenerated 的 permission identifier 为 kebab-case（tauri-plugin build 约定），
# commands.allow 才是 snake_case 命令名。
permissions = [
    "allow-hg-status",
    "allow-hg-connect",
    "allow-hg-disconnect",
    "allow-hg-prepare-vpn",
    "allow-hg-control-start",
    "allow-hg-control-stop",
]
