[package]
name = "download-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "更新下载器测速台：量总耗时 / 峰值·均值速率 / 各分片完成时刻离散度 / 重试次数"

[dependencies]
# 🔴 特性集必须与生产侧**实际解析结果**一致，不是与 src-tauri/Cargo.toml 的字面写法一致。
#
# 生产侧 `src-tauri/Cargo.toml:53` 写的是
#   reqwest = { default-features = false, features = ["json","rustls-tls","stream"] }
# 看起来没有 http2；但同文件 `:39` 的 `tauri-plugin-http = "2.5.9"` **未关默认特性**、
# 依赖同一个 reqwest 0.12.28 ⇒ Cargo 把两边特性取并集 ⇒ `default`（= default-tls +
# charset + http2 + system-proxy）全部被重新打开。实测口径见
# `.claude/rules/common.md「Cargo feature 会跨 dependent 统一」`：
#   cargo tree -e features -i -p reqwest@0.12.28
#
# 若这里图省事照抄那行 `default-features = false, features=[...]`，测速台就会跑在
# **HTTP/1.1** 上（http2 未启用），而 h2 流控窗口那两行完全不生效 ——
# 测出来的数字与线上毫不相干。所以这里显式取 reqwest 的默认特性 + stream。
#
# TLS 后端同理：生产同时有 default-tls 与 rustls-tls，而 `build_client` 没调
# `.use_rustls_tls()` ⇒ 运行时走的是 default-tls（macOS 上即 Security.framework）。
# 这里保持默认特性，运行时后端与生产一致。
reqwest = { version = "0.12.28", features = ["stream"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]
# 测速台本身不能成为瓶颈：默认 release 即可，不开 LTO（编译时间比那点收益重要）
opt-level = 2
